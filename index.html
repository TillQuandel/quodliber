<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quodliber</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group">
          <button id="btn-open" title="Markdown-Datei öffnen">Öffnen</button>
          <button id="btn-save" title="Speichern (Strg+S)">Speichern</button>
        </div>
        <div class="group">
          <button id="btn-host" title="Kommt in Meilenstein 3" disabled>Session starten</button>
          <button id="btn-join" title="Kommt in Meilenstein 3" disabled>Beitreten</button>
        </div>
        <div id="file-label" class="muted">Keine Datei geöffnet</div>
      </header>
      <main id="editor"></main>
      <footer id="statusbar">
        <span id="status-conn" class="muted">offline</span>
        <span id="status-msg" class="muted"></span>
      </footer>
    </div>
  </body>
</html>
