<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quodliber</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div id="app">
      <header id="toolbar">
        <div class="group">
          <button id="btn-open" title="Markdown-Datei öffnen">Öffnen</button>
          <button id="btn-save" title="Speichern (Strg+S)">Speichern</button>
          <input id="name-input" placeholder="Dein Name" title="Autoren-Name (leer = automatisch)" spellcheck="false" maxlength="24" />
        </div>
        <div class="group">
          <button id="btn-host" title="Als Host im LAN lauschen">Session starten</button>
          <button id="btn-inet" title="Internet-Session: Code erzeugen und per Messenger tauschen">Internet-Session</button>
          <input id="join-input" placeholder="ip:port oder QL1-Code" spellcheck="false" />
          <button id="btn-join" title="Mit Host-Code verbinden">Beitreten</button>
          <button id="btn-share-tab" hidden title="Macht den aktiven Tab zum geteilten Dokument — Gäste ziehen automatisch um">⇄ Diesen Tab teilen</button>
          <button id="btn-kick" hidden title="Trennt den Gast und entzieht das gemerkte Vertrauen (nächster Beitritt braucht wieder Bestätigung)">Gast trennen</button>
          <span id="session-code" class="code muted"></span>
          <span id="lan-list" title="Im LAN gefundene Sessions"></span>
        </div>
        <div id="file-label" class="muted">Keine Datei geöffnet</div>
      </header>
      <div id="tabbar">
        <button id="btn-new-tab" title="Neuer leerer Tab">+</button>
      </div>
      <div id="join-banner" hidden>
        <span id="jr-text"></span>
        <button id="btn-jr-accept">Zulassen</button>
        <button id="btn-jr-reject">Ablehnen</button>
      </div>
      <div id="recovery-banner" hidden>
        <span>Nicht gespeicherte Crash-Kopie vom letzten Lauf gefunden.</span>
        <button id="btn-recover">Wiederherstellen</button>
        <button id="btn-recover-dismiss">Verwerfen</button>
      </div>
      <main id="editor"></main>
      <div id="log-panel" hidden>
        <div id="log-head">
          <span>Log</span>
          <button id="btn-log-copy" title="Gesamtes Log in die Zwischenablage">Kopieren</button>
        </div>
        <pre id="log-text"></pre>
      </div>
      <div id="trust-panel" hidden>
        <div id="log-head">
          <span>Vertraute Teilnehmer — dürfen den genannten Dateien ohne Rückfrage beitreten</span>
        </div>
        <div id="trust-list"></div>
      </div>
      <footer id="statusbar">
        <span id="status-conn" class="muted">offline</span>
        <span id="role-info" class="muted"></span>
        <span id="author-legend"></span>
        <button id="btn-colors" title="Autoren-Markierungen ein-/ausblenden">Farben aus</button>
        <button id="btn-log" title="Log-/Debug-Konsole ein-/ausblenden">Log</button>
        <button id="btn-trust" title="Wer darf welchen Dateien ohne Rückfrage beitreten?">Vertraute</button>
        <span id="status-msg" class="muted"></span>
      </footer>
    </div>
  </body>
</html>
